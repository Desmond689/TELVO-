# Your machine has ~7.3GB total RAM. -Xmx8G alone exceeded that, which is
# what was crashing the Gradle daemon ("insufficient memory ... mmap failed").
# Kept modest so Gradle, Android Studio, and Windows can all fit in memory
# at the same time. Increase later only if you upgrade RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
# Running out of RAM also gets easier to avoid by not parallelizing project
# configuration/execution on a low-memory machine.
org.gradle.parallel=false
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
