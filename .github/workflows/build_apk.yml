name: Build APK

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Verify Cloudinary Configuration
        shell: bash
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          set -uo pipefail
          missing=()

          if [ -z "${CLOUDINARY_CLOUD_NAME:-}" ]; then
            if [ -f .env ] && grep -q '^CLOUDINARY_CLOUD_NAME=' .env && ! grep -q "^CLOUDINARY_CLOUD_NAME=your_" .env; then
              :
            else
              missing+=("CLOUDINARY_CLOUD_NAME")
            fi
          fi

          if [ -z "${CLOUDINARY_UPLOAD_PRESET:-}" ]; then
            if [ -f .env ] && grep -q '^CLOUDINARY_UPLOAD_PRESET=' .env && ! grep -q "^CLOUDINARY_UPLOAD_PRESET=your_" .env; then
              :
            else
              missing+=("CLOUDINARY_UPLOAD_PRESET")
            fi
          fi

          if [ ${#missing[@]} -ne 0 ]; then
            echo "::warning title=Cloudinary configuration::Cloudinary secrets are not fully configured; continuing with the build."
            echo "Missing: ${missing[*]}"
          else
            echo "Cloudinary configuration present. Continuing build."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'

      - name: Install dependencies
        run: flutter pub get

      - name: Clean previous build outputs
        run: flutter clean

      - name: Skip launcher icon generation in CI
        run: echo "Skipping launcher icon generation; existing Android resources are already present."

      - name: Create .env from GitHub Secrets
        run: |
          if [ -n "${{ secrets.FIREBASE_API_KEY }}" ] && [ -n "${{ secrets.FIREBASE_APP_ID }}" ] && [ -n "${{ secrets.FIREBASE_SENDER_ID }}" ] && [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            cat > .env <<'EOF'
FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
API_BASE_URL=${{ secrets.API_BASE_URL }}
APP_ENV=production
APP_VERSION=1.0.0
EOF
          elif [ -f .env ]; then
            echo "Using existing committed .env file."
          else
            echo "No Firebase secrets and no committed .env file available."
            exit 1
          fi

      - name: Validate required Firebase configuration
        run: |
          set -uo pipefail
          if [ -f .env ]; then
            echo "Using .env file to provide Firebase configuration."
            exit 0
          fi
          missing=()
          if [ -z "${FIREBASE_API_KEY:-}" ]; then missing+=("FIREBASE_API_KEY"); fi
          if [ -z "${FIREBASE_APP_ID:-}" ]; then missing+=("FIREBASE_APP_ID"); fi
          if [ -z "${FIREBASE_SENDER_ID:-}" ]; then missing+=("FIREBASE_SENDER_ID"); fi
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then missing+=("FIREBASE_PROJECT_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required Firebase secrets: ${missing[*]}"
            exit 1
          fi
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
