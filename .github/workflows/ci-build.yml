name: Flutter CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Create .env from secrets
        run: |
          cat > .env <<'EOF'
          FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET=${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          APP_ENV=production
          APP_VERSION=1.0.0
          EOF

      - name: Validate required Firebase secrets
        run: |
          set -uo pipefail
          missing=()
          if [ -z "${FIREBASE_API_KEY:-}" ]; then missing+=("FIREBASE_API_KEY"); fi
          if [ -z "${FIREBASE_APP_ID:-}" ]; then missing+=("FIREBASE_APP_ID"); fi
          if [ -z "${FIREBASE_SENDER_ID:-}" ]; then missing+=("FIREBASE_SENDER_ID"); fi
          if [ -z "${FIREBASE_PROJECT_ID:-}" ]; then missing+=("FIREBASE_PROJECT_ID"); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing required Firebase secrets: ${missing[*]}"
            exit 1
          fi
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Install dependencies
        run: flutter pub get

      - name: Run analyzer
        run: flutter analyze --fatal-infos

      - name: Build APK
        run: flutter build apk --release
